name: release

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a rebuild even if upstream has not changed
        required: false
        default: false
        type: boolean
      upstream_version:
        description: Override the upstream whisper.cpp version to package
        required: false
        type: string
      libggml_release:
        description: Override the libggml-cuda-bin release tag to build against
        required: false
        type: string
      pkgrel_override:
        description: Override the Arch pkgrel for the release
        required: false
        type: string

concurrency:
  group: whisper-cpp-cuda-bin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: apollo-whisper-cpp-cuda-bin
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect desired release
        id: plan
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || 'false' }}
          LIBGGML_RELEASE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.libggml_release || '' }}
          PKGREL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.pkgrel_override || '' }}
          UPSTREAM_VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_version || '' }}
        run: ./scripts/detect-release.sh >> "$GITHUB_OUTPUT"

      - name: Explain release decision
        run: |
          printf 'should_release=%s\n' '${{ steps.plan.outputs.should_release }}'
          printf 'pkgver=%s\n' '${{ steps.plan.outputs.pkgver }}'
          printf 'pkgrel=%s\n' '${{ steps.plan.outputs.pkgrel }}'
          printf 'libggml=%s-%s\n' '${{ steps.plan.outputs.libggml_pkgver }}' '${{ steps.plan.outputs.libggml_pkgrel }}'
          printf 'reason=%s\n' '${{ steps.plan.outputs.reason }}'

      - name: Build release asset
        if: steps.plan.outputs.should_release == 'true'
        run: |
          ./scripts/run-in-arch-container.sh '
            pacman -Syu --noconfirm \
              cmake \
              curl \
              cuda \
              diffutils \
              jq \
              git \
              nvidia-utils \
              openssh \
              openblas \
              sdl2-compat \
              vulkan-icd-loader
            curl -fsSL \
              "https://github.com/OneNoted/libggml-cuda-bin/releases/download/v${{ steps.plan.outputs.libggml_pkgver }}-${{ steps.plan.outputs.libggml_pkgrel }}/libggml-cuda-bin-${{ steps.plan.outputs.libggml_pkgver }}-${{ steps.plan.outputs.libggml_pkgrel }}-x86_64.tar.zst" \
              -o \
              "/tmp/libggml-cuda-bin-${{ steps.plan.outputs.libggml_pkgver }}-${{ steps.plan.outputs.libggml_pkgrel }}-x86_64.tar.zst"
            ./scripts/build-asset.sh \
              "${{ steps.plan.outputs.pkgver }}" \
              "${{ steps.plan.outputs.pkgrel }}" \
              "${{ steps.plan.outputs.libggml_pkgver }}" \
              "${{ steps.plan.outputs.libggml_pkgrel }}"
            ./scripts/smoke-asset.sh \
              "dist/${{ steps.plan.outputs.asset_name }}" \
              "/tmp/libggml-cuda-bin-${{ steps.plan.outputs.libggml_pkgver }}-${{ steps.plan.outputs.libggml_pkgrel }}-x86_64.tar.zst"
            ./scripts/update-aur-metadata.sh \
              "${{ steps.plan.outputs.pkgver }}" \
              "${{ steps.plan.outputs.pkgrel }}" \
              "${{ steps.plan.outputs.libggml_pkgver }}" \
              "${{ steps.plan.outputs.libggml_pkgrel }}" \
              "dist/${{ steps.plan.outputs.asset_name }}"
          '

      - name: Commit release metadata
        if: steps.plan.outputs.should_release == 'true'
        id: commit
        run: |
          repo_dir=${GITHUB_WORKSPACE:?}

          git config --global --add safe.directory "$repo_dir"
          git -C "$repo_dir" config user.name "Jonatan Jonasson"
          git -C "$repo_dir" config user.email "notes@madeingotland.com"
          git -C "$repo_dir" add PKGBUILD .SRCINFO

          if git -C "$repo_dir" diff --cached --quiet; then
            commit_sha=$(git -C "$repo_dir" rev-parse HEAD)
          else
            git -C "$repo_dir" commit -m "chore: release whisper.cpp-cuda-bin ${{ steps.plan.outputs.pkgver }}-${{ steps.plan.outputs.pkgrel }}"
            git -C "$repo_dir" push origin HEAD:main
            commit_sha=$(git -C "$repo_dir" rev-parse HEAD)
          fi

          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.release_tag }}
          target_commitish: ${{ steps.commit.outputs.commit_sha }}
          files: |
            dist/${{ steps.plan.outputs.asset_name }}
            dist/${{ steps.plan.outputs.asset_name }}.sha256
            PKGBUILD
            .SRCINFO

      - name: Load AUR SSH key
        if: steps.plan.outputs.should_release == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Trust AUR host key
        if: steps.plan.outputs.should_release == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish AUR metadata
        if: steps.plan.outputs.should_release == 'true'
        env:
          AUR_REMOTE: ssh://aur@aur.archlinux.org/whisper.cpp-cuda-bin.git
        run: ./scripts/publish-aur.sh "$AUR_REMOTE"
